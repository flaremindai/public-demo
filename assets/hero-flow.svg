<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">Public decision flow</title>
  <desc id="desc">Facts and rules move through a decision check and produce one traceable result.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff754d"/>
      <stop offset="1" stop-color="#4bd39a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="320" rx="20" fill="#151816"/>
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round">
    <path d="M80 118H240M80 202H240M330 160H424M514 160H570"/>
    <path d="M240 96l28 22-28 22M424 138l28 22-28 22"/>
  </g>
  <g fill="#1b1f1c" stroke="#303630" stroke-width="2">
    <rect x="28" y="84" width="52" height="68" rx="12"/>
    <rect x="28" y="168" width="52" height="68" rx="12"/>
    <rect x="240" y="118" width="90" height="84" rx="14"/>
    <rect x="424" y="118" width="90" height="84" rx="14"/>
    <rect x="514" y="132" width="90" height="56" rx="14"/>
  </g>
  <g fill="#f3f1eb" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="54" y="124">Facts</text>
    <text x="54" y="208">Rules</text>
    <text x="285" y="166">Check</text>
    <text x="469" y="166">State</text>
    <text x="559" y="165">Result</text>
  </g>
  <g fill="#b9bdb6" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
    <text x="320" y="238">Public interaction only</text>
  </g>
</svg>
